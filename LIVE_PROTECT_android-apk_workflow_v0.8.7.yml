name: .github/workflows/android-apk.yml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test backend and build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        shell: bash
        run: |
          ARCHIVE="LIVE_PROTECT_v0.8.7_projeto_atualizado_2026-11-05.zip"
          test -s "$ARCHIVE"
          mkdir -p project-src
          unzip -q "$ARCHIVE" -d project-src
          PROJECT_DIR="$(find project-src -name settings.gradle.kts -print -quit | xargs dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies and run tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$PROJECT_DIR/backend/requirements-dev.txt"
          cd "$PROJECT_DIR"
          python -m pytest -q
          python -m compileall -q backend/live_protect backend/tests

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" clean :app:assembleDebug

      - name: Verify APK signature and package identity
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apksigner-verification.txt
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='br.com.liveprotect'"
          echo "$BADGING" | grep -F "application-label:'LIVE PROTECT'"
          echo "$BADGING" > apk-metadata.txt
          sha256sum "$APK" | tee app-debug.apk.sha256

      - name: Publish installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LIVE-PROTECT-debug-v0.8.7
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            apk-metadata.txt
            apksigner-verification.txt
          if-no-files-found: error
          retention-days: 14
